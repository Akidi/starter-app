<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(function(){const k='app:theme';let t='light';try{const s=localStorage.getItem(k);if(s){const p=JSON.parse(s);if(!p.expiresAt||Date.now()<=p.expiresAt)t=p.value}}catch(e){}document.documentElement.setAttribute('data-theme',t);if(t==='dark')document.documentElement.classList.add('dark')})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
