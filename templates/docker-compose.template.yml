services:
  {{APP_NAME}}.{{ENV}}:
    build:
      context: ./app
      target: production
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "{{PORT}}:3000"
    env_file:
      - .env.{{ENV}}
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - {{APP_NAME}}.db.{{ENV}}
      - {{APP_NAME}}.redis.{{ENV}}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    dns_search:
      - {{APP_NAME}}.internal
    networks:
      {{APP_NAME}}.internal:
        ipv4_address: 172.28.0.10
        aliases:
          - app
          - api
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      com.{{APP_NAME}}.service: "app"
      com.{{APP_NAME}}.environment: "{{ENV}}"
      com.{{APP_NAME}}.version: "${VERSION:-latest}"

  {{APP_NAME}}.db.{{ENV}}:
    image: postgres:16
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: {{POSTGRES_SUPERUSER_PASSWORD}}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Pass role passwords to init script
      ADMIN_PASSWORD: {{ADMIN_PASSWORD}}
      DEVELOPER_PASSWORD: {{DEVELOPER_PASSWORD}}
      API_PASSWORD: {{API_PASSWORD}}
      READONLY_PASSWORD: {{READONLY_PASSWORD}}
      BACKUP_PASSWORD: {{BACKUP_PASSWORD}}
      AUDITOR_PASSWORD: {{AUDITOR_PASSWORD}}
    volumes:
      - type: bind
        source: ./db/init.{{ENV}}.sql
        target: /docker-entrypoint-initdb.d/01-init.sql
        read_only: true
      - type: volume
        source: {{APP_NAME}}_postgres_data_{{ENV}}
        target: /var/lib/postgresql/data
    networks:
      {{APP_NAME}}.internal:
        ipv4_address: 172.28.0.20
        aliases:
          - postgres
          - db
          - database
    healthcheck:
      # Use lorekeeper (read-only) instead of locked-out postgres user
      test: ["CMD-SHELL", "PGPASSWORD={{READONLY_PASSWORD}} pg_isready -U lorekeeper -d {{APP_NAME}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    shm_size: 256m
    tmpfs:
      - /var/run/postgresql
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    labels:
      com.{{APP_NAME}}.service: "database"
      com.{{APP_NAME}}.environment: "{{ENV}}"
      com.{{APP_NAME}}.version: "${VERSION:-latest}"

  {{APP_NAME}}.redis.{{ENV}}:
    image: redis:7
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      # Pass Redis passwords for ACL setup
      REDIS_PASSWORD: {{REDIS_PASSWORD}}
      ADMIN_USER_REDIS_PASSWORD: {{ADMIN_USER_REDIS_PASSWORD}}
      DEVELOPER_USER_REDIS_PASSWORD: {{DEVELOPER_USER_REDIS_PASSWORD}}
      API_USER_REDIS_PASSWORD: {{API_USER_REDIS_PASSWORD}}
      READONLY_USER_REDIS_PASSWORD: {{READONLY_USER_REDIS_PASSWORD}}
      BACKUP_USER_REDIS_PASSWORD: {{BACKUP_USER_REDIS_PASSWORD}}
      AUDITOR_USER_REDIS_PASSWORD: {{AUDITOR_USER_REDIS_PASSWORD}}
    volumes:
      - type: bind
        source: ./redis.{{ENV}}.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
      - type: bind
        source: ./redis.{{ENV}}.acl
        target: /usr/local/etc/redis/users.acl
        read_only: true
      - type: volume
        source: {{APP_NAME}}_redis_data_{{ENV}}
        target: /data
    networks:
      {{APP_NAME}}.internal:
        ipv4_address: 172.28.0.30
        aliases:
          - redis
          - cache
    healthcheck:
      # Use password-based ping since default user is disabled
      test: ["CMD-SHELL", "redis-cli -a {{REDIS_PASSWORD}} --raw ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      com.{{APP_NAME}}.service: "cache"
      com.{{APP_NAME}}.environment: "{{ENV}}"
      com.{{APP_NAME}}.version: "${VERSION:-latest}"

volumes:
  {{APP_NAME}}_postgres_data_{{ENV}}:
    driver: local
    labels:
      com.{{APP_NAME}}.volume.type: "database"
      com.{{APP_NAME}}.environment: "{{ENV}}"
  {{APP_NAME}}_redis_data_{{ENV}}:
    driver: local
    labels:
      com.{{APP_NAME}}.volume.type: "cache"
      com.{{APP_NAME}}.environment: "{{ENV}}"

networks:
  {{APP_NAME}}.internal:
    driver: bridge
    name: {{APP_NAME}}.{{ENV}}.internal
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
    labels:
      com.{{APP_NAME}}.environment: "{{ENV}}"
      com.{{APP_NAME}}.network.type: "internal"
      com.{{APP_NAME}}.version: "1.0"